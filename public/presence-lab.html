<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marvis Presence Lab — orb / energy variations</title>
<style>
  :root{ --ink:#13110D; --cream:#EFE6D4; --dim:#9C8B70; --amber:#D6A367; --emerald:#7C9A6E; --sapphire:#5B7BA1; --ruby:#B8536F;
    --serif:"Iowan Old Style",Palatino,Georgia,serif; --mono:"JetBrains Mono",ui-monospace,monospace; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--serif);
    background:radial-gradient(1100px 600px at 50% -10%,#2C3E50 0,transparent 60%),radial-gradient(800px 500px at 50% 115%,#3a2a1c 0,transparent 55%),var(--ink);}
  header{padding:24px 30px 4px}
  h1{margin:0;font-size:25px;font-weight:500}
  .sub{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 30px 0}
  .tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid #3A3640;color:var(--dim);border-radius:6px;padding:7px 13px;cursor:pointer}
  .tabs button.on{border-color:var(--amber);color:var(--amber);background:rgba(214,163,103,.12)}
  .stage{display:grid;place-items:center;padding:18px}
  canvas{border-radius:16px}
  .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 30px 8px}
  .ctl button{font-family:var(--mono);font-size:11px;text-transform:uppercase;background:transparent;border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:7px 12px;cursor:pointer}
  .ctl button.on{background:rgba(214,163,103,.22)}
  .meta{text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;padding-bottom:30px}
  .desc{text-align:center;color:var(--dim);font-size:13px;max-width:620px;margin:0 auto 6px}
</style>
</head>
<body>
  <header>
    <h1>Marvis Presence Lab — energy variations</h1>
    <div class="sub" id="fleet">reading your live fleet…</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <p class="desc" id="desc"></p>
  <div class="stage"><canvas id="c" width="680" height="400"></canvas></div>
  <div class="ctl" id="ctl">
    <button data-set="idle" class="on">Idle</button>
    <button data-set="listening">Listening</button>
    <button data-set="thinking">Thinking</button>
    <button data-set="speaking">Speaking</button>
  </div>
  <div class="meta">all concepts pulse with your real Claude Code fleet · drive Marvis's state above</div>

<script>
const C=document.getElementById("c"), X=C.getContext("2d"); const W=C.width,H=C.height,cx=W/2,cy=H/2;
let STATE="idle", ACT=0.2, AGENTS=2, ACTIVE=1, t=0, CUR="hearth";

// ---- live fleet (real reactivity) ----
async function poll(){
  try{
    const r=await fetch("/api/sessions",{cache:"no-store"}); const d=await r.json();
    const ss=d.sessions||[]; AGENTS=ss.length; ACTIVE=ss.filter(s=>s.status==="running"||s.currentTool).length;
    ACT=AGENTS? Math.min(1, .2 + ACTIVE/Math.max(AGENTS,1)*.8):.15;
    document.getElementById("fleet").textContent=`live fleet · ${AGENTS} sessions · ${ACTIVE} active`;
  }catch(e){ document.getElementById("fleet").textContent="fleet offline — using demo activity"; }
}
poll(); setInterval(poll,3000);

function col(){ return STATE==="thinking"?"91,123,161":STATE==="listening"?"124,154,110":"214,163,103"; }
function amp(){ return STATE==="speaking"? (Math.sin(t*.5)*.5+.5):0; }

// ---- concepts ----
const CONCEPTS={
  hearth:{label:"Hearth Orb", desc:"Amber core + aura + particle swirl. Particle density tracks fleet activity; pulses with state. The clean default.",
    draw(){ const a=amp(), r=70+Math.sin(t*.04)*4+a*16+ACT*14;
      let g=X.createRadialGradient(cx,cy,r*.4,cx,cy,r*2.3); g.addColorStop(0,`rgba(${col()},${.45+ACT*.2})`); g.addColorStop(1,`rgba(${col()},0)`);
      X.fillStyle=g; X.beginPath(); X.arc(cx,cy,r*2.3,0,6.29); X.fill();
      let cg=X.createRadialGradient(cx-r*.3,cy-r*.3,2,cx,cy,r); cg.addColorStop(0,"#FDEFD2"); cg.addColorStop(.5,STATE==="thinking"?"#7FA0C8":"#E8B86A"); cg.addColorStop(1,STATE==="thinking"?"#3a4f6b":"#8a5a2a");
      X.fillStyle=cg; X.beginPath(); X.arc(cx,cy,r,0,6.29); X.fill();
      const n=8+Math.round(ACT*22); for(let i=0;i<n;i++){ const a2=t*.01+i/n*6.28, rr=r*1.3+Math.sin(t*.03+i)*18+a*20; X.fillStyle=`rgba(255,225,170,${.4+ACT*.4})`; X.beginPath(); X.arc(cx+Math.cos(a2)*rr,cy+Math.sin(a2)*rr,1.7,0,6.29); X.fill(); } } },

  constellation:{label:"Constellation", desc:"Marvis core + one star per live session orbiting. Stars flare when their agent is active, lines tether to the core. Your fleet, as a sky.",
    draw(){ const a=amp(); X.fillStyle=`rgba(${col()},.9)`; let g=X.createRadialGradient(cx,cy,2,cx,cy,40+a*12); g.addColorStop(0,"#FDEFD2"); g.addColorStop(1,`rgba(${col()},0)`); X.fillStyle=g; X.beginPath(); X.arc(cx,cy,40+a*12,0,6.29); X.fill();
      const n=Math.max(3,AGENTS); for(let i=0;i<n;i++){ const ang=t*.006+i/n*6.28, rr=130+Math.sin(t*.02+i)*16, sx=cx+Math.cos(ang)*rr*1.4, sy=cy+Math.sin(ang)*rr; const on=i<ACTIVE;
        X.strokeStyle=`rgba(${col()},${on?.4:.12})`; X.lineWidth=on?1.4:.7; X.beginPath(); X.moveTo(cx,cy); X.lineTo(sx,sy); X.stroke();
        X.fillStyle=on?"#FFE6A8":"rgba(214,163,103,.5)"; X.beginPath(); X.arc(sx,sy,on?4+Math.sin(t*.2+i)*1.5:2.4,0,6.29); X.fill(); } } },

  reactor:{label:"Reactor", desc:"Arc-reactor rings rotating at fleet speed; intensity = load, color = state. Tron meets Laputa.",
    draw(){ const a=amp(); for(let k=0;k<4;k++){ const rr=46+k*26, sp=(t*( .01+ACT*.03))*(k%2?1:-1), seg=4+k; X.strokeStyle=`rgba(${col()},${.3+a*.4+k*.05})`; X.lineWidth=4;
      for(let s=0;s<seg;s++){ const a0=sp+s/seg*6.28, a1=a0+6.28/seg*.6; X.beginPath(); X.arc(cx,cy,rr,a0,a1); X.stroke(); } }
      let cg=X.createRadialGradient(cx,cy,2,cx,cy,30+a*14); cg.addColorStop(0,"#FDEFD2"); cg.addColorStop(1,`rgba(${col()},0)`); X.fillStyle=cg; X.beginPath(); X.arc(cx,cy,30+a*14,0,6.29); X.fill(); } },

  equalizer:{label:"Equalizer Ring", desc:"Radial waveform bars around the core — react to Marvis speaking + fleet activity. The 'voice made visible' option.",
    draw(){ const a=amp(); const n=48; for(let i=0;i<n;i++){ const ang=i/n*6.28; const base=24; const h=base+ (Math.sin(t*.15+i*.6)*.5+.5)*(14+ACT*30+a*40); const x0=cx+Math.cos(ang)*60, y0=cy+Math.sin(ang)*60, x1=cx+Math.cos(ang)*(60+h), y1=cy+Math.sin(ang)*(60+h);
      X.strokeStyle=`rgba(${col()},${.5+a*.4})`; X.lineWidth=3; X.beginPath(); X.moveTo(x0,y0); X.lineTo(x1,y1); X.stroke(); }
      let cg=X.createRadialGradient(cx,cy,2,cx,cy,52); cg.addColorStop(0,"#FDEFD2"); cg.addColorStop(.7,STATE==="thinking"?"#7FA0C8":"#E8B86A"); cg.addColorStop(1,`rgba(${col()},.1)`); X.fillStyle=cg; X.beginPath(); X.arc(cx,cy,52,0,6.29); X.fill(); } },

  crystal:{label:"Laputa Crystal", desc:"A faceted gem (the Laputa stone) slowly rotating, facets catching light, glow intensifies with state. Most Ghibli-specific.",
    draw(){ const a=amp(), R=70+a*10, rot=t*.006, faces=6; X.save(); X.translate(cx,cy); X.rotate(rot);
      let g=X.createRadialGradient(0,0,8,0,0,R*1.8); g.addColorStop(0,`rgba(${col()},.5)`); g.addColorStop(1,`rgba(${col()},0)`); X.fillStyle=g; X.beginPath(); X.arc(0,0,R*1.8,0,6.29); X.fill();
      for(let i=0;i<faces;i++){ const a0=i/faces*6.28, a1=(i+1)/faces*6.28; const shade=.4+ .5*Math.abs(Math.sin(a0+rot*3)); X.fillStyle=`rgba(${STATE==="thinking"?"127,160,200":"253,222,150"},${shade})`;
        X.beginPath(); X.moveTo(0,0); X.lineTo(Math.cos(a0)*R,Math.sin(a0)*R*1.25); X.lineTo(Math.cos(a1)*R,Math.sin(a1)*R*1.25); X.closePath(); X.fill(); X.strokeStyle="rgba(255,240,210,.35)"; X.lineWidth=1; X.stroke(); }
      X.restore(); } },
};
const ORDER=["hearth","constellation","reactor","equalizer","crystal"];

// tabs
const tabsEl=document.getElementById("tabs");
ORDER.forEach(k=>{ const b=document.createElement("button"); b.textContent=CONCEPTS[k].label; b.dataset.k=k; if(k===CUR)b.classList.add("on"); b.onclick=()=>{CUR=k; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.k===k)); document.getElementById("desc").textContent=CONCEPTS[k].desc;}; tabsEl.appendChild(b); });
document.getElementById("desc").textContent=CONCEPTS[CUR].desc;
document.getElementById("ctl").addEventListener("click",e=>{ if(e.target.dataset.set){STATE=e.target.dataset.set; document.querySelectorAll("#ctl button").forEach(b=>b.classList.toggle("on",b.dataset.set===STATE)); } });

function loop(){ t++; X.clearRect(0,0,W,H); CONCEPTS[CUR].draw(); requestAnimationFrame(loop); } loop();
</script>
</body>
</html>
